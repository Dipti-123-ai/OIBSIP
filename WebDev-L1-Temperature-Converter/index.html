<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter | Dipti Nishad</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="converter-container">

        <section class="converter-card">

            <header class="converter-header">
                <p class="eyebrow">TEMPERATURE TOOL</p>
                <h1>Temperature Converter</h1>
                <p class="subtitle">
                    Convert temperatures quickly between Celsius,
                    Fahrenheit, and Kelvin.
                </p>
            </header>

            <div class="converter-form">

                <div class="input-group">
                    <label for="temperature">Temperature</label>

                    <input
                        type="text"
                        id="temperature"
                        placeholder="Enter temperature"
                        autocomplete="off"
                    >

                    <p id="error-message" class="error-message"></p>
                </div>

                <div class="input-group">
                    <label for="unit">Input Unit</label>

                    <select id="unit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <button id="convert-btn" type="button">
                    Convert Temperature
                </button>

            </div>

            <section class="results" aria-live="polite">

                <h2>Converted Values</h2>

                <div class="result-grid">

                    <div class="result-box">
                        <span class="result-label">Celsius</span>
                        <strong id="celsius-result">—</strong>
                    </div>

                    <div class="result-box">
                        <span class="result-label">Fahrenheit</span>
                        <strong id="fahrenheit-result">—</strong>
                    </div>

                    <div class="result-box">
                        <span class="result-label">Kelvin</span>
                        <strong id="kelvin-result">—</strong>
                    </div>

                </div>

            </section>

        </section>

        <footer>
            <p>Built with HTML, CSS & JavaScript</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
